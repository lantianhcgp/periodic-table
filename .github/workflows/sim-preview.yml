# 官方 Lite 模拟器出图（sim-preview）
# 独立文件：revert 本条提交（或删文件）即整体回档，不影响 build.yml。
# 链路：build 成功 → 取 artifact → 解包 .app → GH macOS runner 跑华为官方 Simulator 出图。
# sdk/驱动来自私仓 lantianhcgp/deveco-sim-ci（deploy key 只读拉取，官方二进制不入本仓）。
# 计费：public 仓标准 runner 免费无限。
# FIT3 主验由本仓 qa/official_capture.py 驱动：验证真实缩放、横滑、Cl详情、返回及512KB压力。
name: sim-preview
on:
  workflow_run:
    workflows: [build]
    types: [completed]
  workflow_dispatch:

jobs:
  sim:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master')
    # macos-14 ARM64 于 2026-11-02 退役且高峰排队超时；macos-15 同为标准 M1 ARM64。
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: checkout exact app source under test
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          path: _app

      - name: checkout simulator driver (private, deploy key)
        uses: actions/checkout@v4
        with:
          repository: lantianhcgp/deveco-sim-ci
          ref: aa3a315a766f6dd4983ad8dad9eed2c948c6faba
          ssh-key: ${{ secrets.SIM_CI_SSH_KEY }}
          path: _sim

      - name: download build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RID=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml --branch "${{ github.ref_name }}" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          else
            RID=${{ github.event.workflow_run.id }}
          fi
          test -n "$RID"
          BUILD_SHA=$(gh run view "$RID" -R "$GITHUB_REPOSITORY" --json headSha,conclusion --jq 'select(.conclusion=="success")|.headSha')
          SOURCE_SHA=$(git -C _app rev-parse HEAD)
          test "$BUILD_SHA" = "$SOURCE_SHA" || { echo "artifact/source SHA mismatch: $BUILD_SHA != $SOURCE_SHA"; exit 1; }
          SIM_SHA=$(git -C _sim rev-parse HEAD)
          printf 'build_run=%s\nsource_sha=%s\nsim_sha=%s\n' "$RID" "$SOURCE_SHA" "$SIM_SHA" | tee sim-inputs.txt
          gh run download "$RID" -R "$GITHUB_REPOSITORY" --dir built

      - name: unpack .app
        run: python3 _sim/unpack_app.py built _sim/apps

      - name: env
        run: |
          sw_vers
          SIM=_sim/sdk/openharmony/previewer/liteWearable/bin/Simulator
          chmod +x "$SIM"
          file "$SIM"

      - name: functional + stress gate (official simulator)
        working-directory: _sim
        run: |
          set -o pipefail
          python3 -m pip install --quiet --require-hashes -r ../_app/qa/requirements-sim.txt 2>/dev/null || \
            python3 -m pip install --quiet --user --require-hashes -r ../_app/qa/requirements-sim.txt 2>/dev/null || \
            python3 -m pip install --quiet --break-system-packages --require-hashes -r ../_app/qa/requirements-sim.txt
          python3 ../_app/qa/official_capture.py 2>&1 | tee spawn.txt

      - name: upload frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-preview
          path: |
            _sim/frames/**
            _sim/results.json
            _sim/periodic-official-results.json
            _sim/spawn.txt
            _sim/logs/**
            sim-inputs.txt
          if-no-files-found: ignore
