name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev

      # CLT 6.1.1.280：与工程 modelVersion 6.1.1 / faMode 匹配（勿升 26.x）
      - name: Setup HarmonyOS Command Line Tools
        id: ohos
        uses: ErBWs/setup-ohos@4dbb63025116eb6165ceac58a4bf47cbdc5ac721 # v2
        with:
          version: 6.1.1.280
          cache: true

      - name: Ensure toolchain on PATH
        run: |
          for p in "$HOME/ohos-sdk/command-line-tools/bin" "$HOME/ohos-sdk/command-line-tools/tool/node/bin"; do
            if [ -d "$p" ]; then echo "$p" >> "$GITHUB_PATH"; fi
          done
          if [ -d "$HOME/ohos-sdk/command-line-tools/sdk" ]; then
            echo "HOS_SDK_HOME=$HOME/ohos-sdk/command-line-tools/sdk" >> "$GITHUB_ENV"
          fi
          echo "=== toolchain check ==="
          command -v hvigorw || true
          command -v ohpm || true

      - name: Install project dependencies
        run: ohpm install --all

      - name: Build unsigned App
        run: hvigorw assembleApp --mode project -p product=default -p buildMode=debug --no-daemon --accept-license

      - name: Sanitize packed config.json (Lite schema)
        run: python3 scripts/clean_config_in_app.py build/outputs/default/*.app

      - name: Audit actual Lite payload (48KB pages / image bins / identity)
        run: |
          mkdir -p dist
          python3 scripts/audit_built_app.py 'build/outputs/default/*.app' --report dist/built-audit.json

      # periodic.p7b 绑定 periodic.nexus.qu84q；禁止复用其他应用身份。
      - name: Sign required release HAP
        env:
          SIGN_P12_PEM: ${{ secrets.SIGN_P12_PEM }}
        run: |
          mkdir -p dist
          if [ -f "certs/periodic.p7b" ] && [ -n "$SIGN_P12_PEM" ]; then
            cp -r tools/sign /tmp/sign && cd /tmp/sign
            npm ci --ignore-scripts --no-audit --no-fund
            cd -
            FORCE_P7B_BUNDLE=1 node /tmp/sign/sign-app-to-hap.js build/outputs/default/*.app certs/periodic.p7b dist/periodic-table.hap
            echo "signed dist/periodic-table.hap"
          else
            echo "::error::缺少 certs/periodic.p7b 或 SIGN_P12_PEM，禁止产出假绿的未签名交付"
            exit 1
          fi

      - name: Verify signature (fail loud)
        run: |
          if [ -f "dist/periodic-table.hap" ]; then
            python3 tools/sign/verify_sign.py "dist/periodic-table.hap" "certs/periodic.p7b"
          else
            echo "::error::签名步骤未生成 dist/periodic-table.hap"
            exit 1
          fi

      - name: Re-audit final signed HAP payload
        run: |
          if [ -f "dist/periodic-table.hap" ]; then
            python3 scripts/audit_built_app.py dist/periodic-table.hap --report dist/signed-hap-audit.json
          else
            echo "::error::缺少最终 HAP，无法载荷复审"
            exit 1
          fi

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/outputs/default/*.app dist/ 2>/dev/null || true
          echo "=== dist ==="
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: periodic-table-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
